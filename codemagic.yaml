workflows:
  ios-altstore:
    name: Journal Novembre - IPA gratuite AltStore
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Installer les dépendances
        script: npm ci
      - name: Synchroniser Capacitor
        script: npx cap sync ios
      - name: Construire l'application iPhone sans signature
        script: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/build/JournalNovembre.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""
      - name: Créer l'IPA pour AltStore
        script: |
          rm -rf "$CM_BUILD_DIR/build/Payload"
          mkdir -p "$CM_BUILD_DIR/build/Payload"
          cp -R "$CM_BUILD_DIR/build/JournalNovembre.xcarchive/Products/Applications/App.app" \
            "$CM_BUILD_DIR/build/Payload/JournalNovembre.app"
          cd "$CM_BUILD_DIR/build"
          zip -qry Journal-Novembre-AltStore.ipa Payload
    artifacts:
      - build/Journal-Novembre-AltStore.ipa
      - /tmp/xcodebuild_logs/*.log

  ios-simulator:
    name: Journal Novembre - simulateur iPhone
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Installer les dépendances
        script: npm ci
      - name: Synchroniser Capacitor
        script: npx cap sync ios
      - name: Construire pour le simulateur
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/ios/simulator \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - build/ios/simulator/Build/Products/Debug-iphonesimulator/*.app
      - /tmp/xcodebuild_logs/*.log

  ios-release:
    name: Journal Novembre - IPA signé
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.technova.journalnovembre
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
    scripts:
      - name: Installer les dépendances
        script: npm ci
      - name: Synchroniser Capacitor
        script: npx cap sync ios
      - name: Appliquer les profils Apple
        script: xcode-project use-profiles
      - name: Construire l'IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
